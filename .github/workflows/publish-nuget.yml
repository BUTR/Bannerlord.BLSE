name: Publish NuGet

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-nuget.yml'
      - 'src/Bannerlord.BLSE/**.*'
      - 'src/Bannerlord.LauncherEx/**.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pack Bannerlord.BLSE
        run: dotnet pack src/Bannerlord.BLSE/Bannerlord.BLSE.csproj --configuration Release -o "./packages";
        shell: pwsh

      - name: Pack Bannerlord.LauncherEx
        run: dotnet pack src/Bannerlord.LauncherEx/Bannerlord.LauncherEx.csproj --configuration Release -o "./packages";
        shell: pwsh

      # The packages and their symbol packages travel to the signing and the push
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ./packages/
          if-no-files-found: error

  # Signs Bannerlord.BLSE.dll and Bannerlord.LauncherEx.dll inside the packages with the Certum certificate
  sign:
    needs: [pack]
    uses: BUTR/workflows/.github/workflows/sign-certum.yml@master
    with:
      artifact_name: nuget
    secrets:
      CODE_SIGNING_CLIENT_ID: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
      CODE_SIGNING_PRIVATE_KEY: ${{ secrets.CODE_SIGNING_PRIVATE_KEY }}

  # Pushed from this workflow, so the nuget.org trusted publishing policy for publish-nuget.yml still applies
  publish:
    name: Publish NuGet
    needs: [sign]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Download the signed packages
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ./packages

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Aragas

      - name: Push to NuGet
        run: dotnet nuget push "./packages/*.nupkg" --skip-duplicate --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
        shell: pwsh

      - name: Push to GPR
        run: |
          for f in ./packages/*.nupkg
          do
            curl -vX PUT -u "vslee:${{secrets.GITHUB_TOKEN}}" -F package=@$f https://nuget.pkg.github.com/BUTR/
          done
